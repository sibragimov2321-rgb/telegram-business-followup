<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partners Portal</title><style>:root{--bg:#08111f;--card:#14243b;--accent:#f2b84b;--muted:#9eb0c9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f9fc;font:16px Arial}main{max-width:620px;margin:auto;padding:20px}.hero{padding:28px 20px;text-align:center;background:linear-gradient(145deg,#182b49,#0b1525);border-radius:22px}.mark{width:92px;height:92px;margin:auto;border-radius:25px;display:grid;place-items:center;border:2px solid var(--accent);color:var(--accent);font-size:32px;font-weight:800}.hero h1{margin:15px 0 5px}.hero p{color:var(--muted)}.grid{display:grid;gap:12px;margin-top:18px}.btn{width:100%;padding:17px;border-radius:14px;background:var(--card);color:#fff;border:1px solid #2b4568;text-align:left;font-size:17px;font-weight:700}.primary{border-color:var(--accent);color:var(--accent)}section{margin-top:18px}.back{background:none;color:var(--muted);border:0;padding:8px 0;font-size:16px}h2{color:var(--accent)}input,textarea{width:100%;padding:14px;margin:8px 0 14px;background:#0e1b2d;border:1px solid #2b4568;border-radius:10px;color:#fff}details{margin:10px 0;padding:16px;border-radius:12px;background:var(--card)}summary{font-weight:700;cursor:pointer}.hint{color:var(--muted);line-height:1.5}</style></head><body><main id="app"></main><script src="https://telegram.org/js/telegram-web-app.js"></script><script>const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const app=document.querySelector('#app');const API='/api';let init=tg?.initData||'';async function req(path,opt={}){opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':init};const r=await fetch(API+path,opt);return r.json()}function home(){app.innerHTML='<div class="hero"><div class="mark">PP</div><h1>Partners Portal</h1><p>Партнёры и агенты</p></div><div class="grid">'+[['💼','Агенты','agents'],['👥','Партнёры','partners'],['🖼','Получить баннер','banners'],['🔎','Проверить контакт','check'],['🛡','Проверить блокировку','blocked'],['❓','Вопросы и ответы','faq'],['💬','Поддержка','support'],['👤','Личный кабинет','me']].map(x=>`<button class="btn ${x[2]==='agents'?'primary':''}" onclick="page('${x[2]}')">${x[0]} ${x[1]}</button>`).join('')+'</div>'}function page(k){let titles={agents:'Агенты',partners:'Партнёры',banners:'Рекламные материалы',check:'Проверить контакт',blocked:'Проверить блокировку',faq:'Вопросы и ответы',support:'Поддержка',me:'Личный кабинет'};let b=`<button class="back" onclick="home()">‹ Назад</button><h2>${titles[k]}</h2>`;if(k==='agents'||k==='partners')b+=`<form onsubmit="submitApp(event,'${k==='agents'?'agent':'partner'}')"><input name="name" placeholder="Имя" required><input name="geo" placeholder="Страна / GEO"><input name="email" placeholder="Email"><textarea name="comment" placeholder="Комментарий"></textarea><label><input type="checkbox" required> Согласен с условиями</label><button class="btn primary">Отправить заявку</button></form>`;else if(k==='check'||k==='blocked')b+=`<input id="value" placeholder="@username, email, ID"><button class="btn primary" onclick="lookup('${k}')">Проверить</button><p id="result" class="hint"></p>`;else if(k==='faq')b+=`<div class="grid"><button class="btn primary">Для партнёров</button><button class="btn">Для агентов</button></div><div id="faq" class="grid"></div>`;else if(k==='banners')b+='<p class="hint">Категории: Agents · Partners · Telegram · Instagram · Facebook · Stories · Posts</p><button class="btn primary">Открыть материалы</button>';else if(k==='support')b+='<form onsubmit="ticket(event)"><input name="subject" placeholder="Тема" required><textarea name="text" placeholder="Опишите вопрос" required></textarea><button class="btn primary">Создать обращение</button></form>';else b+='<p class="hint">Загрузка профиля Telegram...</p>';app.innerHTML=b;if(k==='faq')loadFaq()}async function submitApp(e,kind){e.preventDefault();const f=new FormData(e.target);const r=await req('/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,payload:Object.fromEntries(f)})});e.target.innerHTML='<p class="hint">✅ Заявка отправлена. Статус: new</p>'}async function ticket(e){e.preventDefault();const f=new FormData(e.target);await req('/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});e.target.innerHTML='<p class="hint">✅ Обращение создано</p>'}async function lookup(k){const v=document.querySelector('#value').value;const r=await req(k==='check'?'/check-contact?value='+encodeURIComponent(v):'/blocked?value='+encodeURIComponent(v));document.querySelector('#result').textContent=r.message}async function loadFaq(){const rows=await req('/faq');document.querySelector('#faq').innerHTML=(rows.length?rows:[{question:'Какие виды трафика разрешены?',answer:'Уточняется у менеджера.'},{question:'Когда выплаты?',answer:'По правилам программы.'}]).map(x=>`<details><summary>${x.question}</summary><p class="hint">${x.answer}</p></details>`).join('')}home()</script></body></html>
